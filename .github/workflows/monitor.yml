name: areazero Monitor

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 PyGithub

      - name: Descargar estado
        run: |
          curl -s -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -H "Accept: application/vnd.github.v3.raw" \
          "https://api.github.com/repos/ivanareazero-eng/areazero-novedades/contents/state.json" \
          -o areazero_products_state.json || echo '{"products":{},"last_check":null}' > areazero_products_state.json

      - name: Ejecutar monitor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python areazero_monitor_final_6_1.py

      - name: Guardar estado
        run: |
          python3 -c "
import json, base64, urllib.request
token = '${{ secrets.GH_TOKEN }}'
api = 'https://api.github.com/repos/ivanareazero-eng/areazero-novedades/contents/state.json'
headers = {'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json'}
with open('areazero_products_state.json', 'rb') as f:
    data = f.read()
encoded = base64.b64encode(data).decode()
req = urllib.request.Request(api, headers=headers)
sha = None
try:
    with urllib.request.urlopen(req) as r:
        sha = json.loads(r.read())['sha']
except: pass
payload = {'message': 'Actualizar estado', 'content': encoded}
if sha: payload['sha'] = sha
req2 = urllib.request.Request(api, data=json.dumps(payload).encode(), headers=headers, method='PUT')
urllib.request.urlopen(req2)
print('OK')
"

