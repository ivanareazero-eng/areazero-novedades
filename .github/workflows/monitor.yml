name: areazero Monitor

on:
  schedule:
    # 07:00 UTC (09:00 Madrid en verano / 08:00 en invierno) y 17:00 UTC (19:00 / 18:00)
    - cron: '7 7 * * *'
    - cron: '7 17 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Enviar email de prueba solo a ivanareazero@gmail.com'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar monitor
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          TEST_EMAIL: ${{ inputs.test_email && '1' || '0' }}
        run: python areazero_monitor_final_6_1.py

      - name: Guardar dashboard y estado en el repo
        run: |
          git config user.name "areazero-monitor"
          git config user.email "areazero-monitor@users.noreply.github.com"
          git add index.html areazero_products_state.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar dashboard novedades $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push
          fi
