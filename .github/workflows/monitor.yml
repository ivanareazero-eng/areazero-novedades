name: areazero Monitor

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4 PyGithub

      - name: Descargar estado
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3.raw" \
            "https://api.github.com/repos/ivanareazero-eng/areazero-novedades/contents/state.json" \
            -o areazero_products_state.json || echo '{"products":{},"last_check":null}' > areazero_products_state.json

      - name: Ejecutar monitor
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python areazero_monitor_final_6_1.py

      - name: Guardar estado
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 save_state.py

      - name: Subir state.json
        uses: actions/upload-artifact@v4
        with:
          name: state
          path: areazero_products_state.json

